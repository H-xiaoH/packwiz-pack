name: Build Modpack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Bump pack version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TZ: Asia/Shanghai
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          version="$(date +'%y.%-m.%-d.%-H.%-M')"
          sed -i "s/^version = .*/version = \"${version}\"/" pack.toml
          packwiz refresh
          git add pack.toml index.toml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m ":bookmark: chore: bump pack version to ${version}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Verify index is up to date
        run: git diff --exit-code -- pack.toml index.toml

      - name: Export Modrinth pack
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          packwiz modrinth export -y -o "modpack.mrpack" --restrictDomains=false

      - name: Upload Modrinth pack
        uses: actions/upload-artifact@v7
        with:
          name: modrinth-pack
          path: modpack.mrpack
          retention-days: 30

      - name: Upload mrpack to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "OSS credentials not configured; skipping upload"
            exit 0
          fi
          curl -sL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
          unzip -q ossutil.zip
          ./ossutil-2.1.2-linux-amd64/ossutil cp modpack.mrpack oss://mc-hxiaoh/modpack.mrpack \
            --region cn-shenzhen \
            --endpoint oss-cn-shenzhen.aliyuncs.com \
            -f \
            --acl public-read \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET"

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest modpack.mrpack \
            --title "Latest build $(date +'%Y-%m-%d %H:%M')" \
            --notes "自动发布：main 最新构建（commit $(git rev-parse --short HEAD)）" \
            --latest

      - name: Publish version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin HEAD:main

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download modpack artifacts
        uses: actions/download-artifact@v8
        with:
          name: modrinth-pack
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
