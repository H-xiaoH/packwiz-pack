name: Build Modpack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh pack index
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          packwiz refresh

      - name: Verify index is up to date
        run: git diff --exit-code -- pack.toml index.toml

      - name: Export Modrinth pack
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          packwiz modrinth export -y -o "My-Modpack.mrpack"

      - name: Export CurseForge pack
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          packwiz curseforge export -y -o "My-Modpack-CurseForge.zip"

      - name: Upload Modrinth pack
        uses: actions/upload-artifact@v7
        with:
          name: modrinth-pack
          path: My-Modpack.mrpack
          retention-days: 30

      - name: Upload CurseForge pack
        uses: actions/upload-artifact@v7
        with:
          name: curseforge-pack
          path: My-Modpack-CurseForge.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download modpack artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*pack'
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
